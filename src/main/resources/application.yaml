spring:
  application:
    name: ecommerce-springboot

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: change-this-secret-key-to-something-long-123456
  expiration-ms: 86400000   # 1 ngày

file:
  upload-dir: uploads




