spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: redis
      port: 6379
      timeout: 60000

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
